project:
  type: website

website:
  title: "Math Learning Blog"
  navbar:
    left:
      - href: index.qmd
        text: Home

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: mathjax
    include-in-header:
      - text: |
          <script>
            window.MathJax = {
              tex: {
                tags: 'ams',
                macros: {
                  Spec: '\\text{Spec}',
                  Proj: '\\text{Proj}',
                  O: '\\mathcal{O}',
                  F: '\\mathcal{F}'
                }
              }
            };
          </script>
    include-before-body: latex/math.tex
